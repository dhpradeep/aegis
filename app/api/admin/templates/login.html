<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login · Aegis</title>
  <link rel="icon" type="image/svg+xml" href="/admin/static/favicon.svg?v={{ asset_version }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/static/dashboard.css?v={{ asset_version }}">
  <script>
    (function () {
      var t;
      try { t = localStorage.getItem('admin-theme'); } catch (e) {}
      document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
    })();
  </script>
</head>
<body class="login-body">
  <form class="login-card" method="post" action="/admin/login">
    <div class="brand">
      <span class="brand-mark"></span>
      <span>
        <span class="brand-name">Aegis</span><br>
        <span class="brand-sub">Admin Console</span>
      </span>
    </div>
    <h2>Sign in</h2>
    <p class="hint">Enter the admin password to continue.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autofocus required>
    <button type="submit">Log in</button>
  </form>
</body>
</html>
